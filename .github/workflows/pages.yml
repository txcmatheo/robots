name: Publicar en GitHub Pages

# Publica dos versiones separadas:
#   /robots/v1/  versión del estudio (etiqueta v1-estudio)
#   /robots/v2/  versión del ring de Stream Fighters (esta rama)
#   /robots/     la más reciente (la del ring)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Versión actual (ring)
        run: |
          npm ci
          npm run build
          mkdir -p sitio/v2
          cp -r dist/. sitio/
          cp -r dist/. sitio/v2/
      - uses: actions/checkout@v4
        with:
          ref: v1-estudio
          path: v1src
      - name: Versión 1 (estudio)
        working-directory: v1src
        run: |
          npm ci
          npm run build
          mkdir -p ../sitio/v1
          cp -r dist/. ../sitio/v1/
      - run: touch sitio/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
